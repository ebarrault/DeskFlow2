spring:
  application:
    name: helpdesk
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/helpdesk}
    username: ${DATABASE_USER:helpdesk}
    password: ${DATABASE_PASSWORD:helpdesk}
  jpa:
    hibernate:
      ddl-auto: validate          # le schéma est géré par Flyway
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true

springdoc:
  swagger-ui.path: /swagger-ui.html
  api-docs.path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-a-changer-absolument-32-caracteres-minimum}
    ttl: ${JWT_TTL:PT8H}
  cors-origins: ${CORS_ORIGIN:http://localhost:4200}
  upload-dir: ${UPLOAD_DIR:./uploads}
  url: ${APP_URL:http://localhost:4200}
  mail-from: ${MAIL_FROM:Helpdesk <helpdesk@example.local>}
  seed: ${SEED:false}

logging:
  level:
    fr.portfolio.helpdesk: INFO
